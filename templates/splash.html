<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ splash_screen }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/splash.css') }}">
</head>
<body>
    <main class="splash-container">
        <h1>{{ splash_screen }}</h1>
        <div class="app-info">
            <div class="info-row">
                <span class="label">Application:</span>
                <span class="value">{{ app_name }} v{{ version }}</span>
            </div>
            <div class="info-row">
                <span class="label">Started:</span>
                <span class="value">{{ startup_iso }}</span>
            </div>
            <div class="info-row">
                <span class="label">Uptime:</span>
                <span class="value">{{ "%.1f"|format(uptime_seconds) }} seconds</span>
            </div>
            <div class="info-row">
                <span class="label">DB Mode:</span>
                <span class="value">{{ "Enabled" if db_router_enabled else "Disabled (No DB)" }}</span>
            </div>
        </div>
        <nav class="navigation" aria-label="Application links">
            <a href="/docs">API Docs</a>
            <a href="/health">Health Check</a>
        </nav>
    </main>
</body>
</html>
